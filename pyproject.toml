[project]
name = "callumployed"
version = "0.1.0"
description = "Local-first job-search automation CLI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
  { name = "Callum Mackenzie" }
]
dependencies = [
  "beautifulsoup4>=4.12",
  "extruct>=0.16",
  "httpx>=0.27",
  "keyring>=25.0",
  "lxml>=5.2",
  "platformdirs>=4.2",
  "playwright>=1.44",
  "playwright-stealth>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyturso>=0.6.1",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "trafilatura>=1.12",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-mock>=3.14",
  "ruff>=0.5",
  "types-beautifulsoup4",
]
agents = [
  "langchain-core",
  "langchain-openai",
  "langgraph",
]
mcp = [
  "mcp",
]

[project.scripts]
callumployed = "callumployed.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "agent: tests with mocked LangChain/model responses",
  "browser: tests requiring Playwright/browser runtime",
  "integration: tests touching real services",
  "mcp: MCP server/tool tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
