<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>callumployed</title>
    <link rel="stylesheet" href="/assets/app.css?v=20260727-4" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-lockup">
          <img class="brand-logo" src="/assets/camackenzie-logo.svg" alt="callum mackenzie" />
          <div>
            <p class="eyebrow">callumployed</p>
            <h1>job tracker</h1>
          </div>
        </div>
        <button class="settings-open" id="settings-open" type="button" aria-label="open settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
            <path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.06.06a2.1 2.1 0 0 1-2.97 2.97l-.06-.06a1.8 1.8 0 0 0-1.98-.36 1.8 1.8 0 0 0-1.08 1.65v.18a2.1 2.1 0 0 1-4.2 0v-.1a1.8 1.8 0 0 0-1.17-1.69 1.8 1.8 0 0 0-1.98.36l-.06.06a2.1 2.1 0 0 1-2.97-2.97l.06-.06a1.8 1.8 0 0 0 .36-1.98 1.8 1.8 0 0 0-1.65-1.08h-.18a2.1 2.1 0 0 1 0-4.2h.1a1.8 1.8 0 0 0 1.69-1.17 1.8 1.8 0 0 0-.36-1.98l-.06-.06a2.1 2.1 0 0 1 2.97-2.97l.06.06a1.8 1.8 0 0 0 1.98.36h.08a1.8 1.8 0 0 0 1.08-1.65v-.18a2.1 2.1 0 0 1 4.2 0v.1a1.8 1.8 0 0 0 1.08 1.65 1.8 1.8 0 0 0 1.98-.36l.06-.06a2.1 2.1 0 0 1 2.97 2.97l-.06.06a1.8 1.8 0 0 0-.36 1.98v.08a1.8 1.8 0 0 0 1.65 1.08h.18a2.1 2.1 0 0 1 0 4.2h-.1a1.8 1.8 0 0 0-1.65 1.08Z"></path>
          </svg>
        </button>
      </header>

      <section class="stats-grid" id="stats" aria-label="overall stats"></section>

      <section class="materials-panel" id="materials-panel" aria-label="application materials">
        <button class="materials-toggle" id="materials-toggle" type="button" aria-expanded="true">
          <span class="materials-chevron">v</span>
          <span class="materials-title">application materials</span>
          <span class="materials-summary" id="materials-summary">resume + cover letters</span>
        </button>
        <div class="materials-body" id="materials-body">
          <div class="material-row">
            <div class="material-status">
              <p class="material-label">resume</p>
              <p class="material-meta" id="resume-meta">no resume uploaded</p>
            </div>
            <input class="sr-only" id="resume-upload" type="file" accept=".tex,text/x-tex" />
            <button type="button" id="resume-upload-button">upload</button>
          </div>
          <div class="material-row">
            <div class="material-status">
              <p class="material-label">cover letters</p>
              <p class="material-meta" id="cover-letter-meta">no examples uploaded</p>
              <ul class="examples-list" id="cover-letter-list"></ul>
            </div>
            <input
              class="sr-only"
              id="cover-letter-upload"
              type="file"
              accept=".tex,.txt,.md,.docx,text/plain,text/markdown,text/x-tex,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
              multiple
            />
            <button type="button" id="cover-letter-upload-button">upload</button>
          </div>
        </div>
      </section>

      <section class="review-entry" aria-label="discovered review">
        <button type="button" id="review-discovered">review discovered</button>
        <button type="button" id="scan-all-button">scan roles</button>
        <div class="scan-summary" id="scan-summary" aria-live="polite">
          <span id="scan-status-text">scan idle</span>
          <span class="scan-status-last" id="scan-last-time">last scan: never</span>
        </div>
      </section>

      <section class="status-toolbar" aria-label="status navigation">
        <div class="view-actions">
          <button class="search-toggle" id="search-toggle" type="button" aria-haspopup="dialog" aria-label="search jobs">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m16.5 16.5 4 4"></path>
            </svg>
            <svg class="search-clear-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m16.5 16.5 4 4"></path>
              <path d="m8.5 8.5 5 5"></path>
              <path d="m13.5 8.5-5 5"></path>
            </svg>
          </button>
          <button type="button" id="toggle-all">expand all</button>
          <button type="button" id="collapse-empty">show empty</button>
        </div>
      </section>

      <section class="status-list" id="status-list" aria-live="polite"></section>
    </main>

    <section class="search-dialog" id="search-dialog" aria-labelledby="search-heading" hidden>
      <button class="search-backdrop" id="search-backdrop" type="button" aria-label="close search"></button>
      <div class="search-panel" role="dialog" aria-modal="true">
        <header class="search-header">
          <div>
            <p class="eyebrow">tracker search</p>
            <h2 id="search-heading">search jobs</h2>
          </div>
          <button type="button" id="close-search">close</button>
        </header>
        <form class="search" id="search-form" hidden>
          <label class="sr-only" for="search-input">search jobs</label>
          <input id="search-input" name="q" type="search" placeholder="search company, title, status" />
          <button type="submit">search</button>
        </form>
      </div>
    </section>

    <section class="review-view" id="review-view" aria-label="discovered job review" hidden>
      <div class="review-shell">
        <header class="review-header">
          <div>
            <p class="eyebrow">discovered review</p>
            <h2 id="review-heading">review queue</h2>
          </div>
          <button type="button" id="close-review">close</button>
        </header>
        <div class="review-progress" id="review-progress"></div>
        <article class="review-card" id="review-card"></article>
      </div>
      <div class="review-actions" aria-label="review actions">
        <button class="review-action danger" type="button" data-review-action="disinterested">disinterested</button>
        <button class="review-action" type="button" data-review-action="later">look later</button>
        <button class="review-action success" type="button" data-review-action="interested">interested</button>
      </div>
    </section>

    <aside class="scan-status-bar" id="scan-status-bar" aria-label="scan running" hidden>
      <span class="scan-status-dot" aria-hidden="true"></span>
    </aside>

    <section class="settings-view" id="settings-view" aria-label="settings" hidden>
      <div class="settings-shell">
        <header class="settings-header">
          <div>
            <p class="eyebrow">callumployed</p>
            <h2 id="settings-heading">settings</h2>
          </div>
          <button type="button" id="settings-close">close</button>
        </header>
        <div class="settings-status" id="settings-status" role="status" aria-live="polite"></div>
        <form class="settings-form" id="settings-form">
          <div class="settings-options" id="settings-options"></div>
        </form>
      </div>
    </section>

    <script src="/assets/app.js?v=20260727-5" type="module"></script>
  </body>
</html>
